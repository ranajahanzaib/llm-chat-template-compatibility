[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-chat-template-compatibility"
version = "0.1.0"
description = "Find the prompt and token differences behind inconsistent local LLM behavior."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "typer>=0.12,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.19"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
templateparity = "templateparity.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/templateparity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/templateparity/cli.py" = ["B008"]
